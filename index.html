<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Pizza Coin Wallet Connect</title> <style> body{ margin:0; padding:0; background:#000; display:flex; justify-content:center; align-items:center; height:100vh; font-family:Arial,sans-serif; color:white; } .container{ width:95%; max-width:700px; text-align:center; } h1{ font-size:60px; font-weight:bold; margin-bottom:50px; } button{ width:100%; padding:25px; font-size:28px; font-weight:bold; border:none; border-radius:15px; cursor:pointer; background:#ff9800; color:white; } button:hover{ opacity:.9; } #wallet{ margin-top:40px; font-size:24px; word-break:break-all; } .connected{ color:#00ff00; font-weight:bold; font-size:30px; margin-bottom:20px; } </style> </head> <body> <div class="container"> <h1> 🍕 PIZZA COIN 🍕 </h1> <button id="connectButton"> 🔗 CONNECT POLYGON WALLET </button> <div id="wallet"> Not Connected </div> </div> <script> const button=document.getElementById("connectButton"); const wallet=document.getElementById("wallet"); button.onclick=async()=>{ if(typeof window.ethereum==="undefined"){ wallet.innerHTML="No Wallet Detected"; return; } try{ const accounts=await window.ethereum.request({ method:"eth_requestAccounts" }); wallet.innerHTML= "<div class='connected'>✅ CONNECTED</div>"+ accounts[0]; } catch(err){ wallet.innerHTML="Connection Cancelled"; } }; </script> </body> </html>
